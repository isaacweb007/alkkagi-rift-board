<body>
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>
  <div id="progress" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#top"><span class="brand-mark"></span><span>ALKKAGI · RIFT BOARD</span></a>
    <div class="top-actions">
      <label for="language" class="sr-only" data-i18n="languageLabel"></label>
      <select id="language" class="lang-select" aria-label="Language">
        <option value="ko">한국어</option><option value="en">English</option><option value="vi">Tiếng Việt</option>
        <option value="zh">简体中文</option><option value="ja">日本語</option><option value="id">Bahasa Indonesia</option><option value="hi">हिन्दी</option>
      </select>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
    </div>
  </header>
  <nav class="side-nav" id="sideNav" aria-label="Concept book navigation"></nav>
  <nav class="mobile-menu" id="mobileMenu" aria-label="Mobile navigation"></nav>

  <section class="hero" id="top">
    <div class="hero-inner">
      <span class="eyebrow" data-i18n="hero.eyebrow"></span>
      <h1 data-i18n="hero.title"></h1>
      <p class="hero-sub" data-i18n="hero.subtitle"></p>
      <div class="hero-actions"><a class="btn primary" href="#rules" data-i18n="hero.primary"></a><a class="btn" href="#ui" data-i18n="hero.secondary"></a></div>
    </div>
  </section>
  <section class="quick-grid" id="quickGrid"></section>

  <main id="main">
    <section class="section" id="vision"><div class="section-head"><div><span class="kicker" data-i18n="vision.kicker"></span><h2 data-i18n="vision.title"></h2><div class="rule-line"></div></div><p class="lead" data-i18n="vision.lead"></p></div><div class="glass-grid" id="pillars"></div></section>

    <section class="section" id="story"><div class="section-head"><div><span class="kicker" data-i18n="story.kicker"></span><h2 data-i18n="story.title"></h2><div class="rule-line"></div></div><p class="lead" data-i18n="story.lead"></p></div><div class="story-map"><article class="panel story-origin"><h3 data-i18n="story.originTitle"></h3><p data-i18n="story.origin"></p></article><div class="acts" id="acts"></div></div></section>

        systems:{kicker:'06 · Progression',title:'다섯 능력치와 세 겹의 성장',lead:'추진력·중량·내구·정밀·회전은 모든 돌의 공통 언어다. 랭크는 15점 예산을 지키고, 수치 성장은 싱글/PvE에 두며, 모든 모드의 장기 성장은 표현과 숙련 기록으로 보여 준다.',statsTitle:'5대 공통 능력치',stats:[{name:'추진력',desc:'같은 충전에서 초기 속도가 높다.'},{name:'중량',desc:'운동량 전달과 밀림 저항이 높다.'},{name:'내구',desc:'충돌 뒤 에너지를 보존하지만 과진입할 수 있다.'},{name:'정밀',desc:'미세 힘 조절 구간이 넓다.'},{name:'회전',desc:'곡선과 접촉 뒤 방향 제어가 강하다.'}],upgradesTitle:'성장 구조',upgrades:[{title:'마스터리 1–20',desc:'표정, 재질, 등장 연출, 승리 포즈, 짧은 음성, 시대 혼합 의상을 연다. 전투력은 증가하지 않는다.'},{title:'랭크 튜닝',desc:'추진력 +1이면 다른 능력 -1처럼 총합 15를 유지하는 공개 사이드그레이드. 무료 플레이로도 획득한다.'},{title:'모험 강화',desc:'보스 방어막, 퍼즐 도구, 상태 저항 등 싱글/PvE 전용 성장. 랭크 로드아웃으로 가져갈 수 없다.'}],itemsTitle:'아이템·코스메틱 콘셉트',items:[{title:'황동 튜닝 키',desc:'랭크 사이드그레이드 슬롯'},{title:'달빛 궤적 수정',desc:'조준을 가리지 않는 코스메틱'},{title:'네온 카트리지',desc:'현대식 충돌 스트릭'},{title:'오로라 코어',desc:'미래 재질과 로비 연출'},{title:'승리 왕관',desc:'마스터리 최종 포즈'},{title:'표정 마스크',desc:'감정 애니메이션 세트'},{title:'리플레이 프리즘',desc:'골든 샷 하이라이트'},{title:'훈련 티켓',desc:'캐릭터 무료 체험'}]},
        ui:{kicker:'07 · Interface System V2',title:'당기는 순간 모든 정보가 보인다',lead:'조준선을 가리지 않는 HUD 안에서 턴, 8대8 생존, 당기는 방향, 첫 접촉점, 0–100 파워, MAX 위험, 회전과 BONUS SHOT을 모양·위치·소리로 동시에 전달한다.',screens:[{title:'게임 로비',desc:'왼쪽 아이콘 내비게이션, 중앙 캐릭터와 시공의 판, 오른쪽 프로필·시즌·파티·아레나 선택, 아래 큰 플레이 진입을 한 화면에서 보여 준다.'},{title:'당구식 전투 HUD',desc:'선택 돌 뒤로 당기는 핸들, 짧은 점선 궤적, 첫 접촉 마커, 파랑·금색·빨강 MAX 게이지와 미세 조절 링을 크게 둔다. 상대를 떨어뜨리면 BONUS SHOT 아이콘과 내 턴 링이 계속 빛난다.'},{title:'캐릭터·상점',desc:'10종 그리드, 3D 미리보기, 5각 능력치, 마스터리, 스킨과 포즈, 직접 구매를 분리한다. 랜덤 상자와 도박 표현은 사용하지 않는다.'}],navTitle:'로비 내비게이션 7개 기능',navItems:['플레이','캐릭터','스토리','트릭샷','상점','시즌','설정']},
        audio:{kicker:'08 · Audio & Character Voice V2',title:'무서운 추락, 너무 귀여운 비명',lead:'충전, 놓기, 재질 충돌, 카메라 전달, 낙하 바람과 캐릭터 비명을 같은 결과 비트에 정렬한다. 판 아래는 무섭지만 캐릭터의 퇴장은 코믹하고 사랑스러워야 한다.',tiers:[{title:'접촉',desc:'아주 작은 틱. 카메라와 입자는 사용하지 않는다.'},{title:'가벼운 충돌',desc:'명확한 재질 클릭과 점 입자 1–2개.'},{title:'단단한 충돌',desc:'트랜지언트와 몸통, 얇은 접촉 링, 15–30ms 압축.'},{title:'강타',desc:'저역, 방향 파편, 35–55ms 로컬 연출과 100ms 이내 복귀.'},{title:'낙하+비명',desc:'이탈음, 0.6–1.1초 귀여운 비명, 멀어지는 바람과 마지막 뿅/퐁/삡 구조음.'}],musicTitle:'세 시대, 하나의 5음 모티프',music:'중세 92 BPM, 현대 104 BPM, 미래 112 BPM을 시작점으로 같은 다섯 음을 시대별 악기로 변주한다. 마디 경계에서 차분·위험·매치포인트 스템을 수직 전환한다.',stems:['차분한 턴','위험 가장자리','매치 포인트','결과 스팅'],voiceTitle:'캐릭터 음성이 키포인트',voice:'캐릭터마다 가장자리 당황 3종, 비언어 추락 비명 6종, 먼 거리 마무리 3종을 둔다. 여러 돌은 60–90ms씩 엇갈리고 가까운 세 돌만 전체 비명을 사용한다.',accessTitle:'접근성 원칙',access:'음악·카메라 모션·섬광을 꺼도 샷, 강타, 위험, 낙하, 보너스 샷과 턴 전환을 알 수 있어야 한다. 마스터·음악·효과·환경·UI·음성을 별도 조절한다.'},
        economy:{kicker:'09 · Fair Web3',title:'재미를 먼저, 지갑은 선택',lead:'게임 경제는 비현금 플레이 포인트, 환전 불가 프리미엄 크레딧, 후기 규제 파일럿의 출금 가능 잔액을 서로 다른 원장으로 분리한다. 첫 열 판에는 지갑·토큰·출금 유도가 없다.',ledgers:[{title:'PLAY POINT · PP',desc:'캠페인·미션·캐주얼 대전에서 얻는 양도·환전 불가 포인트. 캐릭터 체험과 기본 외형에 사용한다.'},{title:'PREMIUM CREDIT · PC',desc:'직접 구매형 캐릭터 외형, 시대 의상, 포즈, 시즌 패스에 사용한다. 랭크 전투력과 연결하지 않는다.'},{title:'WITHDRAWABLE · WB',desc:'허용 국가의 성인·KYC/AML·지역 허가를 통과한 별도 파일럿 전용. 일반 PP/PC와 UI·API·매치 큐를 섞지 않는다.'}],guardTitle:'한국 1.0 출시 가드레일',guard:'플레이 결과의 현금·토큰 출금과 경기 베팅은 비활성화한다. 현금성 기능은 대상 국가별 게임·도박·가상자산·결제·세금 검토와 독립적인 보안·공정성 게이트를 모두 통과한 뒤에만 별도 제품으로 연다.'},
        roadmap:{kicker:'10 · Production Plan',title:'위험한 것부터 증명한다',lead:'물리 손맛과 결정성, 온라인 권위, 3D 콘텐츠 생산성, 비현금 운영, 선택적 Web3 순으로 게이트를 통과한다. 토큰으로 재미 부족을 보완하지 않는다.',phases:[{label:'PHASE 0',title:'물리 그레이박스',desc:'회색 판과 몽돌 16개, 마우스 조준, 낙하, 로컬 리플레이. 60초 안의 첫 유효 샷과 동일 입력의 동일 결과를 증명한다.'},{label:'PHASE 1',title:'버티컬 슬라이스',desc:'중세 아레나, 캐릭터 3종, 튜토리얼, AI, T0–T4 충돌과 접근성. PC 웹 60fps와 반복 플레이 의사를 검증한다.'},{label:'PHASE 2',title:'온라인 알파',desc:'서버 권위 물리, 캐주얼·친선, 재접속, 결과 해시, 리플레이와 신고·차단을 완성한다.'},{label:'PHASE 3',title:'콘텐츠 베타',desc:'아레나 3종, 캐릭터 10종, 23경기 캠페인, 랭크, 마스터리와 비현금 상점을 연다.'},{label:'PHASE 4',title:'PC 웹 1.0',desc:'한국판 무출금 출시, 시즌 0 운영, 브라우저·부하·결제·등급분류·접근성 검수를 완료한다.'},{label:'PHASE 5+',title:'선택적 Web3',desc:'게임 승패와 무관한 소유 기능부터 검토하고, 현금성 경쟁은 허용 국가의 소규모 초대 파일럿으로만 진행한다.'}],promise:'좋은 돌이 승리를 주지 않는다.',promiseSub:'좋은 한 수가 돌에게 이름을 준다.'},
        footer:{production:'VISUAL PRODUCTION NOTE',note:'이 콘셉트북의 14개 이미지는 제공된 GPT 이미지 생성 경로로 제작했다. Higgsfield 커넥터는 현재 환경에 없어 직접 호출하지 않았으며, 동일 재생성을 위한 프롬프트 명세를 프로젝트에 별도로 보존한다.',assets:'14 GENERATED CONCEPT ASSETS · 7 LANGUAGES'}

      en:{
        htmlLang:'en',documentTitle:'ALKKAGI: Rift Board — Visual Concept Bible',skip:'Skip to content',languageLabel:'Select language',
        nav:[{id:'vision',label:'Game vision'},{id:'story',label:'World & story'},{id:'rules',label:'Game rules'},{id:'characters',label:'10 characters'},{id:'arenas',label:'3D arenas'},{id:'systems',label:'Stats & items'},{id:'ui',label:'Lobby & UI/UX'},{id:'audio',label:'Music & impact'},{id:'economy',label:'Web3 economy'},{id:'roadmap',label:'Roadmap'}],
        hero:{eyebrow:'PC WEB · TURN-BASED · BILLIARDS POWER · RING-OUT',title:'ALKKAGI: Rift Board',subtitle:'Pull backward to aim, load the power and knock rivals into the abyss. Score a ring-out and shoot again—until only your last stone remains.',primary:'See the core controls',secondary:'Explore the battle HUD'},
        quick:[{value:'8 vs 8',label:'Stones per team'},{value:'5–8 min',label:'Target match time'},{value:'10',label:'Launch characters'},{value:'3',label:'Medieval · Modern · Future'}],
        vision:{kicker:'01 · Product Vision',title:'Every flick becomes a story',lead:'Select, pull and release: three actions create endless outcomes through contact point, force, spin, banks and position. Characters and economy amplify the physics fun; they never replace it.',pillars:[{title:'Readable physics',desc:'No hidden win chance: every collision and ring-out must make visual sense. Competitive results are reproducible from server-authoritative replays.'},{title:'Last-stone comeback',desc:'A save or chain collision can reverse a numbers disadvantage, preserving tension until the final piece falls.'},{title:'Character, not power',desc:'Ranked stat totals are fixed at 15. Spending expands expression and play style, never purchased victory.'}]},
        story:{kicker:'02 · Story Bible',title:'The First Board across three eras',lead:'An ancient ritual once ended wars with stones instead of blades. It survives in a medieval keep, a neon city and an orbital nation. A rookie Tuner and eight nameless stones confront the Black Point, which wants every possible outcome reduced to one.',originTitle:'Origin — eight nameless stones',origin:'Long ago, a mason carved eight round stones to stop a war. The rite—victory to the side with the last stone standing—changed across the ages. The player is the final Tuner who can hear each stone’s vibration and direction.',acts:[{title:'Prologue · Ten first flicks',desc:'Play ten wallet-free, purchase-free matches that teach selection, collision, banking, spin and rescue. After the tenth win, the Nameless gain faces and names.'},{title:'Act I · Twilight Keep',desc:'A kingdom is frozen by a perfect prophecy. With Sir Brick, Lunabelle and Pinch, break the predicted trajectory and recover the Shard of Courage.'},{title:'Act II · Neon City',desc:'An illegal prediction engine rigs the rooftop league. Momo, Beatcat and Dr. Safety expose the false aim line and restore the Shard of Improvisation.'},{title:'Act III · Aurora Orbit',desc:'A central machine forces every athlete down the same path. Zero-Bolt, Comet Kid and Aurora-8 defeat the Blank Order and open the cross-era league.'}]},
        rules:{kicker:'03 · Core Rules V2',title:'Pull to aim. Load the power. Knock them off.',lead:'An 8v8 turn-based physics duel. Pull your stone opposite the shot, set direction and billiards-style power, then release. Ring out an opponent to earn a bonus shot; miss and the turn passes. The last player with a stone on the arena wins.',core:[{title:'Mouse or touch pullback',desc:'Grab a stone and pull opposite the shot. Releasing launches it forward along the aim line.'},{title:'Billiards power 0–100',desc:'Blue control, gold heavy, red MAX. Hold Shift and use the wheel for one-point fine tuning.'},{title:'Ring out, shoot again',desc:'Drop one or more opponents to earn one BONUS SHOT. Multi-ring-outs never stack extra shots.'},{title:'Last stone wins',desc:'Your own stone can fall too. Remove all eight opposing stones to win immediately.'}],flow:['Select · pull backward','Tune power and spin · release','Resolve all ring-outs','Success: BONUS SHOT · Miss: pass turn'],steps:[{title:'Select a stone',desc:'Choose one surviving ally. Costumes and accessories never alter the collision radius.'},{title:'Pull backward',desc:'Drag opposite the shot. Show only the short opening path and first-contact marker.'},{title:'MAX and fine power',desc:'0–69 control, 70–89 heavy, 90–100 MAX. Maximum force is strongest and carries the highest self-ring-out risk.'},{title:'Release, resolve, reward',desc:'After every stone stops, confirm ring-outs. Drop an opponent to shoot again; otherwise pass the turn.'}],modes:[{title:'Rift Campaign',desc:'Ten-match prologue plus thirteen story matches. Every beat teaches or combines a mechanic.'},{title:'Trickshot Lab',desc:'Drop only the targets within a shot limit. Rewind and slow replay turn outcomes into lessons.'},{title:'Casual & Friendly',desc:'Quick match or room code with rules presets. No cash-value rewards.'},{title:'Ranked 1v1',desc:'Standard board, authoritative server, replay and anti-cheat. Fifteen-point builds and equal aim information.'}]},
        roster:{kicker:'04 · Launch Roster',title:'Ten small stones you will remember',lead:'Every character shares one circular floor collider. Silhouette, face, a short sonic signature and the five-stat allocation create the role. PvE signature skills are disabled in standard ranked play.',filters:{all:'All',medieval:'Medieval',modern:'Modern',future:'Future'},eras:{common:'Common',medieval:'Medieval',modern:'Modern',future:'Future'},skill:'PvE skill',counter:'Counterplay'},

        arenas:{kicker:'05 · World Art V2',title:'Cute stones above terrifying drops',lead:'Danger beneath the board gives Alkkagi its tension. A medieval forge, a modern megacity drop and a future gravity well look radically different while ranked board size, friction, gravity and boundaries remain identical.',items:[{title:'Forge of Fallen Kings',short:'Medieval Abyss',desc:'A chain-suspended board above lava rivers, vast furnace vents, broken bridges and dragon shadows in smoke. Fire below and moonlight above reveal the fall depth.'},{title:'Stormline Apex',short:'Neon Megacity',desc:'A rail-less maintenance tower, traffic thousands of meters below, lightning and swaying cables. The board stays dry and clean; beyond it is open air.'},{title:'Gravity Well',short:'Future Vortex',desc:'A violet gravity vortex pulls station fragments and escape pods downward. Beautiful cosmic depth opens beneath a standard-gravity competitive board.'}]},
        systems:{kicker:'06 · Progression',title:'Five stats, three layers of growth',lead:'Drive, Mass, Durability, Precision and Spin form a shared language. Ranked preserves a 15-point budget; numerical growth belongs in PvE; long-term identity comes from mastery and expression.',statsTitle:'Five core attributes',stats:[{name:'Drive',desc:'Higher initial speed at equal charge.'},{name:'Mass',desc:'Transfers momentum and resists displacement.'},{name:'Durability',desc:'Retains post-contact energy but can overshoot.'},{name:'Precision',desc:'Widens the fine-control power window.'},{name:'Spin',desc:'Strengthens curve and post-contact control.'}],upgradesTitle:'Growth architecture',upgrades:[{title:'Mastery 1–20',desc:'Unlock expressions, materials, entrances, victory poses, short voice lines and cross-era outfits—never combat power.'},{title:'Ranked tuning',desc:'Public sidegrades keep a total of 15: Drive +1 requires another stat −1. Everything is earnable through play.'},{title:'Adventure upgrades',desc:'Boss shields, puzzle tools and status resistance live only in solo/PvE and cannot enter ranked loadouts.'}],itemsTitle:'Items & cosmetic concepts',items:[{title:'Brass Tuning Key',desc:'Ranked sidegrade slot'},{title:'Moon Trail Crystal',desc:'Aim-safe cosmetic trail'},{title:'Neon Cartridge',desc:'Modern contact streak'},{title:'Aurora Core',desc:'Future material and lobby FX'},{title:'Victory Crown',desc:'Final mastery pose'},{title:'Expression Mask',desc:'Emotion animation pack'},{title:'Replay Prism',desc:'Golden-shot highlight'},{title:'Training Ticket',desc:'Free character trial'}]},
        ui:{kicker:'07 · Interface System V2',title:'Every control reads while you pull',lead:'A board-safe HUD communicates turn, 8v8 survivors, pullback direction, first contact, 0–100 power, MAX risk, spin and BONUS SHOT through shape, position and sound.',screens:[{title:'Game Lobby',desc:'Icon navigation on the left, selected character and Rift Board at center, profile/season/party/arena on the right, and one dominant Play entry below.'},{title:'Billiards Battle HUD',desc:'A rear drag handle, short dotted path, first-contact marker, large blue-gold-red MAX meter and fine-control ring surround the selected stone. A ring-out keeps your turn ring lit and triggers the BONUS SHOT icon.'},{title:'Collection & Shop',desc:'Separate the ten-character grid, 3D preview, stat pentagon, mastery, cosmetics and direct purchase. No loot boxes or gambling cues.'}],navTitle:'Seven lobby destinations',navItems:['Play','Characters','Story','Trickshots','Shop','Season','Settings']},
        audio:{kicker:'08 · Audio & Character Voice V2',title:'A terrifying fall, an adorable scream',lead:'Charge, release, material impact, camera impulse, falling air and character voice align into one result beat. The void is frightening; the character exit stays comic and lovable.',tiers:[{title:'Touch',desc:'A tiny tick with no camera or particles.'},{title:'Light contact',desc:'A clear material click and one or two particles.'},{title:'Solid hit',desc:'Transient plus body, thin contact ring and 15–30ms compression.'},{title:'Heavy hit',desc:'Low-end layer, directional fragments, 35–55ms local beat and sub-100ms recovery.'},{title:'Ring-out + scream',desc:'Edge release, a 0.6–1.1s cute scream, distance-filtered whoosh and a final pop, boing or beep rescue sound.'}],musicTitle:'Three eras, one five-note motif',music:'Starting points: medieval 92 BPM, modern 104 BPM, future 112 BPM. The same five notes change instruments, while calm, danger and match-point stems transition on bar lines.',stems:['Calm turn','Edge danger','Match point','Result sting'],voiceTitle:'Character voice is a key feature',voice:'Each character gets three edge-panic breaths, six nonverbal fall screams and three distant endings. Multi-ring-outs stagger voices by 60–90ms; only the closest three use full screams.',accessTitle:'Accessibility contract',access:'Shots, heavy hits, danger, ring-outs, bonus shots and turn changes remain readable with music, camera motion or flashes disabled. Master, music, SFX, ambience, UI and voice each have their own control.'},
        economy:{kicker:'09 · Fair Web3',title:'Fun first. Wallet optional.',lead:'The economy separates non-cash Play Points, non-redeemable Premium Credits and a future regulated Withdrawable Balance into different ledgers. The first ten matches never prompt wallets, tokens or cash-out.',ledgers:[{title:'PLAY POINT · PP',desc:'Non-transferable, non-redeemable points earned through campaign, missions and casual play; used for trials and base cosmetics.'},{title:'PREMIUM CREDIT · PC',desc:'Used for direct-choice character looks, era outfits, poses and season passes. Never connected to ranked power.'},{title:'WITHDRAWABLE · WB',desc:'Only for a later adult, KYC/AML and geofenced pilot in permitted markets; separate from PP/PC in UI, APIs and matchmaking.'}],guardTitle:'Korea 1.0 guardrail',guard:'Cash/token redemption of gameplay results and match wagering stay disabled. Any cash-value product opens only after jurisdiction-specific gaming, gambling, virtual-asset, payment and tax review plus independent security and fairness gates.'},
        roadmap:{kicker:'10 · Production Plan',title:'Prove the riskiest thing first',lead:'Gate the work in order: tactile deterministic physics, authoritative online play, repeatable 3D production, non-cash live operations, then optional Web3. A token never compensates for weak retention.',phases:[{label:'PHASE 0',title:'Physics graybox',desc:'Gray board, 16 Mongdol stones, mouse aiming, ring-out and local replay. Prove a valid first shot within 60 seconds and identical results from identical inputs.'},{label:'PHASE 1',title:'Vertical slice',desc:'Medieval arena, three characters, tutorial, AI, T0–T4 impacts and accessibility. Verify 60fps PC web performance and replay intent.'},{label:'PHASE 2',title:'Online alpha',desc:'Authoritative physics, casual/friendly rooms, reconnect, result hash, replay, report and block.'},{label:'PHASE 3',title:'Content beta',desc:'Three arenas, ten characters, 23-match campaign, ranked, mastery and a non-cash shop.'},{label:'PHASE 4',title:'PC web 1.0',desc:'Korea launch without cash-out; Season 0 plus browser, load, payment, rating and accessibility review.'},{label:'PHASE 5+',title:'Optional Web3',desc:'Start with ownership unrelated to match outcomes. Cash competition remains a small invite-only pilot in permitted jurisdictions.'}],promise:'A better stone does not grant victory.',promiseSub:'A better flick gives the stone its name.'},

        hero:{eyebrow:'PC WEB · THEO LƯỢT · LỰC BI-A · HẤT KHỎI BÀN',title:'ALKKAGI: Bàn Cờ Khe Nứt',subtitle:'Kéo ngược để ngắm, nạp lực và hất đối thủ xuống vực. Làm rơi một viên để bắn tiếp—cho đến khi đá cuối cùng của bạn còn lại.',primary:'Xem điều khiển cốt lõi',secondary:'Khám phá HUD trận đấu'},

        vision:{kicker:'01 · Tầm nhìn sản phẩm',title:'Mỗi cú búng trở thành một câu chuyện',lead:'Chọn, kéo và thả: ba thao tác tạo ra vô số kết quả nhờ điểm chạm, lực, xoáy, bật thành và vị trí. Nhân vật cùng kinh tế chỉ làm sâu thêm niềm vui vật lý, không thay thế nó.',pillars:[{title:'Vật lý dễ hiểu',desc:'Không có tỷ lệ thắng ẩn. Mọi va chạm và rơi bàn đều phải hợp lý bằng hình ảnh, có thể tái hiện từ replay máy chủ.'},{title:'Lật ngược bằng viên cuối',desc:'Một cú cứu hoặc chuỗi va chạm vẫn có thể đảo ngược bất lợi quân số, giữ căng thẳng đến viên cuối cùng.'},{title:'Cá tính, không bán sức mạnh',desc:'Tổng chỉ số xếp hạng cố định ở 15. Chi tiêu mở rộng biểu đạt và phong cách, không mua chiến thắng.'}]},
        story:{kicker:'02 · Kinh thánh cốt truyện',title:'Bàn Cờ Đầu Tiên qua ba thời đại',lead:'Một nghi lễ cổ từng chấm dứt chiến tranh bằng đá thay cho lưỡi kiếm. Nó tồn tại trong thành trì trung cổ, thành phố neon và quốc gia quỹ đạo. Một Tuner tân binh cùng tám viên đá vô danh chống lại Điểm Đen muốn ép mọi kết quả chỉ còn một.',originTitle:'Khởi nguyên — tám viên đá vô danh',origin:'Ngày xưa, một thợ đá tạc tám viên đá tròn để ngăn chiến tranh. Nghi lễ bên còn viên cuối sẽ thắng đã biến đổi qua nhiều thời đại. Người chơi là Tuner cuối cùng nghe được rung động và hướng đi của từng viên đá.',acts:[{title:'Mở đầu · Mười cú búng đầu tiên',desc:'Chơi mười trận không ví và không mua hàng để học chọn, va chạm, bật thành, xoáy và cứu nguy. Sau chiến thắng thứ mười, nhóm Vô Danh có khuôn mặt và tên.'},{title:'Hồi I · Thành Hoàng Hôn',desc:'Một vương quốc bị đóng băng bởi lời tiên tri hoàn hảo. Cùng Ngài Brick, Lunabelle và Pinch phá quỹ đạo đã định và giành Mảnh Dũng Khí.'},{title:'Hồi II · Thành Phố Neon',desc:'Máy dự đoán bất hợp pháp thao túng giải đấu sân thượng. Momo, Beatcat và Tiến sĩ Safety vạch trần đường ngắm giả và lấy lại Mảnh Ứng Biến.'},{title:'Hồi III · Quỹ Đạo Aurora',desc:'Máy trung tâm ép mọi vận động viên đi cùng một quỹ đạo. Zero-Bolt, Comet Kid và Aurora-8 đánh bại Đoàn Vô Danh và mở giải liên thời đại.'}]},
        rules:{kicker:'03 · Luật cốt lõi V2',title:'Kéo để ngắm, nạp lực, hất đối thủ xuống',lead:'Đấu vật lý theo lượt 8v8. Kéo viên đá ngược hướng bắn, chỉnh hướng và lực kiểu bi-a rồi thả. Làm rơi đối thủ được bắn thưởng; trượt thì đổi lượt. Người cuối cùng còn đá trên đấu trường thắng.',core:[{title:'Kéo bằng chuột hoặc cảm ứng',desc:'Giữ viên đá và kéo ngược hướng bắn. Thả tay để phóng về phía trước theo đường ngắm.'},{title:'Lực bi-a 0–100',desc:'Xanh để kiểm soát, vàng đòn mạnh, đỏ MAX. Giữ Shift và dùng bánh xe để chỉnh từng điểm.'},{title:'Làm rơi, bắn thêm',desc:'Làm rơi một hay nhiều đối thủ nhận một BONUS SHOT. Không cộng dồn nhiều lượt.'},{title:'Viên đá cuối cùng thắng',desc:'Đá của bạn cũng có thể rơi. Loại cả tám đá đối phương để thắng ngay.'}],flow:['Chọn · kéo ngược','Chỉnh lực và xoáy · thả','Xác nhận đá rơi','Thành công: BONUS SHOT · Trượt: đổi lượt'],steps:[{title:'Chọn đá',desc:'Chọn một đồng minh còn trên bàn. Trang phục không đổi bán kính va chạm.'},{title:'Kéo về sau',desc:'Kéo ngược cú bắn. Chỉ hiện đoạn đầu quỹ đạo và điểm chạm đầu tiên.'},{title:'MAX và vi chỉnh lực',desc:'0–69 kiểm soát, 70–89 đòn mạnh, 90–100 MAX. Lực tối đa mạnh nhất nhưng dễ tự rơi nhất.'},{title:'Thả, xác nhận, thưởng lượt',desc:'Khi mọi viên dừng, xác nhận rơi. Làm rơi đối thủ thì bắn tiếp; nếu không thì đổi lượt.'}],modes:[{title:'Chiến dịch Khe Nứt',desc:'Mười trận mở đầu cộng mười ba trận cốt truyện. Mỗi nhịp đều dạy hoặc kết hợp một cơ chế.'},{title:'Phòng Trickshot',desc:'Chỉ làm rơi mục tiêu trong số cú bắn giới hạn. Tua lại và quay chậm biến kết quả thành bài học.'},{title:'Thường & Bạn bè',desc:'Ghép nhanh hoặc mã phòng với bộ luật tùy chọn. Không có phần thưởng quy đổi tiền.'},{title:'Xếp hạng 1v1',desc:'Bàn chuẩn, máy chủ quyền uy, replay và chống gian lận. Tổng 15 điểm và thông tin ngắm như nhau.'}]},
        roster:{kicker:'04 · Đội hình ra mắt',title:'Mười viên đá nhỏ nhưng khó quên',lead:'Mọi nhân vật dùng chung một collider tròn dưới chân. Hình bóng, gương mặt, âm thanh nhận diện ngắn và cách chia năm chỉ số tạo nên vai trò. Kỹ năng PvE bị tắt trong xếp hạng chuẩn.',filters:{all:'Tất cả',medieval:'Trung cổ',modern:'Hiện đại',future:'Tương lai'},eras:{common:'Chung',medieval:'Trung cổ',modern:'Hiện đại',future:'Tương lai'},skill:'Kỹ năng PvE',counter:'Cách khắc chế'},

        arenas:{kicker:'05 · Mỹ thuật thế giới V2',title:'Đá dễ thương trên vực sâu đáng sợ',lead:'Hiểm nguy dưới bàn tạo căng thẳng cho Alkkagi. Lò luyện trung cổ, độ cao siêu đô thị và giếng trọng lực tương lai khác hẳn nhau, nhưng kích thước, ma sát, trọng lực và biên xếp hạng vẫn giống nhau.',items:[{title:'Lò Luyện Các Vua Sa Ngã',short:'Vực Trung Cổ',desc:'Bàn treo bằng xích trên sông dung nham, miệng lò khổng lồ, cầu gãy và bóng rồng trong khói.'},{title:'Đỉnh Tuyến Bão',short:'Siêu Đô Thị Neon',desc:'Tháp bảo trì không lan can, xe cộ sâu hàng nghìn mét, sét và cáp đung đưa. Ngoài mép bàn là khoảng không.'},{title:'Giếng Trọng Lực',short:'Xoáy Tương Lai',desc:'Xoáy tím hút mảnh trạm và tàu thoát hiểm. Vực vũ trụ đẹp nhưng đáng sợ mở dưới bàn vật lý chuẩn.'}]},
        systems:{kicker:'06 · Tiến trình',title:'Năm chỉ số, ba tầng phát triển',lead:'Lực đẩy, Khối lượng, Độ bền, Chính xác và Xoáy là ngôn ngữ chung. Xếp hạng giữ ngân sách 15; tăng số nằm trong PvE; bản sắc dài hạn đến từ mastery và biểu đạt.',statsTitle:'Năm thuộc tính cốt lõi',stats:[{name:'Lực đẩy',desc:'Tốc độ đầu cao hơn với cùng lực nạp.'},{name:'Khối lượng',desc:'Truyền động lượng và chống bị đẩy.'},{name:'Độ bền',desc:'Giữ năng lượng sau va chạm nhưng dễ đi quá.'},{name:'Chính xác',desc:'Mở rộng vùng tinh chỉnh lực.'},{name:'Xoáy',desc:'Tăng đường cong và kiểm soát sau chạm.'}],upgradesTitle:'Kiến trúc phát triển',upgrades:[{title:'Mastery 1–20',desc:'Mở biểu cảm, vật liệu, xuất hiện, dáng thắng, thoại ngắn và trang phục liên thời đại—không tăng sức mạnh.'},{title:'Tinh chỉnh xếp hạng',desc:'Sidegrade công khai luôn tổng 15: +1 Lực đẩy cần −1 chỉ số khác. Tất cả có thể kiếm khi chơi.'},{title:'Nâng cấp phiêu lưu',desc:'Khiên boss, công cụ đố và kháng trạng thái chỉ ở solo/PvE, không vào xếp hạng.'}],itemsTitle:'Ý tưởng vật phẩm & mỹ phẩm',items:[{title:'Chìa Khóa Đồng',desc:'Ô sidegrade xếp hạng'},{title:'Tinh Thể Vệt Trăng',desc:'Vệt mỹ phẩm không che ngắm'},{title:'Hộp Neon',desc:'Vệt va chạm hiện đại'},{title:'Lõi Aurora',desc:'Vật liệu và FX tương lai'},{title:'Vương Miện Chiến Thắng',desc:'Dáng mastery cuối'},{title:'Mặt Nạ Biểu Cảm',desc:'Gói hoạt ảnh cảm xúc'},{title:'Lăng Kính Replay',desc:'Điểm nhấn cú bắn vàng'},{title:'Vé Huấn Luyện',desc:'Thử nhân vật miễn phí'}]},
        ui:{kicker:'07 · Hệ thống giao diện V2',title:'Mọi điều khiển đều rõ khi đang kéo',lead:'HUD không che bàn cho biết lượt, số đá 8v8, hướng kéo, chạm đầu, lực 0–100, vùng MAX, xoáy và BONUS SHOT bằng hình, vị trí và âm thanh.',screens:[{title:'Sảnh Game',desc:'Điều hướng biểu tượng trái, nhân vật và Bàn Khe Nứt giữa, hồ sơ/mùa/đội/đấu trường phải, nút Chơi lớn bên dưới.'},{title:'HUD Chiến Đấu Kiểu Bi-a',desc:'Tay kéo phía sau, đường chấm ngắn, dấu chạm đầu, đồng hồ MAX xanh-vàng-đỏ và vòng vi chỉnh bao quanh đá đã chọn. Làm rơi đối thủ giữ sáng vòng lượt và bật biểu tượng BONUS SHOT.'},{title:'Bộ Sưu Tập & Cửa Hàng',desc:'Tách lưới 10 nhân vật, xem 3D, ngũ giác chỉ số, mastery, mỹ phẩm và mua trực tiếp. Không hòm ngẫu nhiên.'}],navTitle:'Bảy điểm đến trong sảnh',navItems:['Chơi','Nhân vật','Cốt truyện','Trickshot','Cửa hàng','Mùa','Cài đặt']},
        audio:{kicker:'08 · Âm thanh & giọng nhân vật V2',title:'Cú rơi đáng sợ, tiếng hét cực dễ thương',lead:'Nạp lực, thả, va chạm, xung camera, gió rơi và giọng nhân vật cùng vào một nhịp kết quả. Vực sâu đáng sợ nhưng màn rời sân phải hài hước và đáng yêu.',tiers:[{title:'Chạm',desc:'Tiếng “tích” rất nhỏ, không camera hay hạt.'},{title:'Va nhẹ',desc:'Tiếng vật liệu rõ và một-hai hạt.'},{title:'Va chắc',desc:'Transient + body, vòng chạm mỏng và nén 15–30ms.'},{title:'Đòn mạnh',desc:'Lớp trầm, mảnh theo hướng, nhịp cục bộ 35–55ms, hồi dưới 100ms.'},{title:'Rơi + tiếng hét',desc:'Âm rời mép, tiếng hét dễ thương 0,6–1,1 giây, gió xa dần và tiếng “bụp/bing” cứu hộ cuối.'}],musicTitle:'Ba thời đại, một mô-típ năm nốt',music:'Mốc đầu: trung cổ 92 BPM, hiện đại 104 BPM, tương lai 112 BPM. Năm nốt đổi nhạc cụ; stem yên, nguy hiểm và điểm trận chuyển ở đầu ô nhịp.',stems:['Lượt yên','Nguy hiểm mép','Điểm trận','Âm kết quả'],voiceTitle:'Giọng nhân vật là điểm nhấn',voice:'Mỗi nhân vật có 3 hơi hoảng ở mép, 6 tiếng hét phi ngôn ngữ và 3 âm kết từ xa. Khi nhiều viên rơi, giọng lệch nhau 60–90ms; chỉ ba viên gần nhất dùng tiếng hét đầy đủ.',accessTitle:'Cam kết tiếp cận',access:'Cú bắn, đòn mạnh, nguy hiểm, rơi, lượt thưởng và đổi lượt vẫn rõ khi tắt nhạc, chuyển động camera hoặc chớp sáng.'},
        economy:{kicker:'09 · Web3 công bằng',title:'Niềm vui trước. Ví tùy chọn.',lead:'Kinh tế tách Play Point không tiền, Premium Credit không đổi và Withdrawable Balance của pilot có quản lý thành ba sổ khác nhau. Mười trận đầu không mời ví, token hay rút tiền.',ledgers:[{title:'PLAY POINT · PP',desc:'Điểm không chuyển nhượng, không quy đổi từ chiến dịch, nhiệm vụ và chơi thường; dùng thử nhân vật và mỹ phẩm cơ bản.'},{title:'PREMIUM CREDIT · PC',desc:'Dùng cho ngoại hình chọn trực tiếp, trang phục thời đại, dáng và season pass. Không nối sức mạnh xếp hạng.'},{title:'WITHDRAWABLE · WB',desc:'Chỉ dành cho pilot người lớn, KYC/AML và giới hạn vùng tại thị trường cho phép; tách khỏi PP/PC trong UI, API và ghép trận.'}],guardTitle:'Rào chắn Hàn Quốc 1.0',guard:'Tắt quy đổi kết quả chơi thành tiền/token và cược trận. Sản phẩm có giá trị tiền chỉ mở sau đánh giá theo quốc gia về game, cờ bạc, tài sản ảo, thanh toán, thuế cùng kiểm định an ninh và công bằng độc lập.'},
        roadmap:{kicker:'10 · Kế hoạch sản xuất',title:'Chứng minh rủi ro lớn nhất trước',lead:'Đi qua từng cổng: vật lý có cảm giác và quyết định, online quyền uy, sản xuất 3D lặp lại, vận hành không tiền, rồi Web3 tùy chọn. Token không bù cho retention yếu.',phases:[{label:'GIAI ĐOẠN 0',title:'Graybox vật lý',desc:'Bàn xám, 16 Mongdol, ngắm chuột, rơi và replay cục bộ. Chứng minh cú hợp lệ trong 60 giây và cùng input cho cùng kết quả.'},{label:'GIAI ĐOẠN 1',title:'Vertical slice',desc:'Đấu trường trung cổ, ba nhân vật, hướng dẫn, AI, va chạm T0–T4 và tiếp cận. Kiểm tra 60fps PC web.'},{label:'GIAI ĐOẠN 2',title:'Alpha online',desc:'Vật lý máy chủ, phòng thường/bạn bè, kết nối lại, hash kết quả, replay, báo cáo và chặn.'},{label:'GIAI ĐOẠN 3',title:'Beta nội dung',desc:'Ba đấu trường, mười nhân vật, chiến dịch 23 trận, xếp hạng, mastery và cửa hàng không tiền.'},{label:'GIAI ĐOẠN 4',title:'PC web 1.0',desc:'Ra mắt Hàn Quốc không rút tiền; Mùa 0 và kiểm tra trình duyệt, tải, thanh toán, phân loại, tiếp cận.'},{label:'GIAI ĐOẠN 5+',title:'Web3 tùy chọn',desc:'Bắt đầu từ sở hữu không liên quan kết quả; thi đấu tiền chỉ pilot mời nhỏ tại khu vực cho phép.'}],promise:'Đá tốt hơn không trao chiến thắng.',promiseSub:'Cú búng tốt hơn trao cho viên đá một cái tên.'},
        footer:{production:'GHI CHÚ SẢN XUẤT HÌNH ẢNH',note:'Mười bốn hình trong concept bible được tạo bằng đường tạo ảnh GPT hiện có. Môi trường này không có kết nối Higgsfield nên không gọi trực tiếp; prompt đã được lưu để tái tạo sau.',assets:'14 HÌNH Ý TƯỞNG · 7 NGÔN NGỮ'}

        hero:{eyebrow:'PC网页 · 回合制 · 台球力量 · 击落',title:'弹棋：时空之盘',subtitle:'反向拉动瞄准，蓄力后把对手撞入深渊。成功击落即可再射一次，直到己方最后一石留在盘上。',primary:'查看核心操作',secondary:'查看战斗HUD'},

        vision:{kicker:'01 · 产品愿景',title:'每一次弹射都成为故事',lead:'选择、拉动、释放：三个动作通过接触点、力量、旋转、反弹与站位创造无数结果。角色与经济只放大物理乐趣，绝不取代它。',pillars:[{title:'可读的物理',desc:'没有隐藏胜率；每次碰撞与落盘都应在画面上说得通，并可通过服务器权威回放重现。'},{title:'最后一石的逆转',desc:'一次救援或连锁碰撞仍能逆转数量劣势，让紧张感持续到最后一枚棋石。'},{title:'卖个性，不卖力量',desc:'排位属性总和固定为15。付费扩展表现和风格，而不是购买胜利。'}]},
        story:{kicker:'02 · 剧情圣经',title:'贯穿三时代的初代之盘',lead:'古老仪式曾以棋石代替刀剑终结战争，它留存在中世纪城堡、霓虹都市与轨道国。新手调律师和八枚无名石对抗试图把所有结果归一的“黑点”。',originTitle:'起源 — 八枚无名石',origin:'很久以前，一位石匠雕出八枚圆石阻止战争。最后留石的一方获胜，这项仪式在时代中不断变化。玩家是最后一位能听见棋石振动与方向的调律师。',acts:[{title:'序章 · 十次初弹',desc:'在无钱包、无购买提示的十场比赛中学习选择、碰撞、反弹、旋转与救援。第十次胜利后，无名石获得面孔和名字。'},{title:'第一幕 · 黄昏城塞',desc:'完美预言冻结了王国。与砖骑士、月娜贝尔和发条平奇打破既定轨迹，夺回勇气碎片。'},{title:'第二幕 · 霓虹都市',desc:'非法预测引擎操纵屋顶联赛。桃桃、节拍猫与安全博士揭穿虚假瞄准线，恢复即兴碎片。'},{title:'第三幕 · 极光轨道国',desc:'中央计算体强迫所有选手走同一路径。零号螺栓、彗星小子与极光-8击败无相团，开启跨时代联赛。'}]},
        rules:{kicker:'03 · 核心规则 V2',title:'反向拉动瞄准，蓄满力量，把对手撞下去',lead:'8对8回合制物理对战。向发射反方向拉动己方棋石，像台球一样调整方向与力量后释放。击落对手可获得奖励射击；未击落则换回合。最后仍有棋石留在竞技盘上的玩家获胜。',core:[{title:'鼠标或触控反向拉动',desc:'抓住棋石向发射反方向拉。松手后沿瞄准线向前射出。'},{title:'台球式力量 0–100',desc:'蓝色控制、金色重击、红色MAX。按住Shift并滚动滚轮可逐点微调。'},{title:'击落后再来一次',desc:'击落一枚或多枚对手棋石，获得一次BONUS SHOT；多枚也不叠加。'},{title:'最后一石获胜',desc:'自己的棋石也可能坠落。先清空对方八枚棋石立即获胜。'}],flow:['选择 · 反向拉动','调整力量与旋转 · 释放','确认全部坠落','成功：BONUS SHOT · 失败：换回合'],steps:[{title:'选择棋石',desc:'选择仍在场的一枚己方棋石。服装与配件不改变碰撞半径。'},{title:'向后拉动',desc:'向发射反方向拖动。只显示短初始轨迹与首个接触点。'},{title:'MAX与力量微调',desc:'0–69控制、70–89重击、90–100 MAX。最大力量最强，自坠风险也最高。'},{title:'释放、结算、奖励',desc:'所有棋石停稳后确认坠落。击落对手则继续射击，否则交换回合。'}],modes:[{title:'时空战役',desc:'十场序章加十三场主线；每个剧情节点都教授或组合机制。'},{title:'技巧球实验室',desc:'在限制次数内只击落目标；回退和慢放把结果变成课程。'},{title:'休闲与好友',desc:'快速匹配或房间码，可选规则预设；没有现金价值奖励。'},{title:'排位1v1',desc:'标准盘、权威服务器、回放与反作弊；确保15点配装和相同瞄准信息。'}]},

        arenas:{kicker:'05 · 世界美术 V2',title:'可爱棋石之下，是恐怖深渊',lead:'盘下危险赋予弹棋真正的紧张感。中世纪熔炉、现代摩天落差、未来重力井各不相同，但排位盘的尺寸、摩擦、重力与边界完全一致。',items:[{title:'陨王熔炉',short:'中世纪深渊',desc:'锁链悬盘下是熔岩河、巨型炉口、断桥与烟中的龙影，火光与月光强化坠落深度。'},{title:'风暴线之巅',short:'霓虹高空',desc:'无护栏维修塔、千米之下的车流、闪电与摇摆缆线；盘面干燥清晰，边外即是高空。'},{title:'重力井',short:'未来涡旋',desc:'紫色重力涡旋吸引空间站碎片与逃生舱，美丽又可怕的宇宙深度在标准物理盘下展开。'}]},
        systems:{kicker:'06 · 成长系统',title:'五项属性，三层成长',lead:'推进、质量、耐久、精度与旋转构成共同语言。排位维持15点预算；数值成长留给PvE；长期身份来自熟练度与外观表达。',statsTitle:'五项核心属性',stats:[{name:'推进',desc:'相同蓄力下初速更高。'},{name:'质量',desc:'传递动量并抵抗位移。'},{name:'耐久',desc:'碰撞后保留能量，但可能冲过头。'},{name:'精度',desc:'扩大细微力量控制区。'},{name:'旋转',desc:'强化曲线与接触后控制。'}],upgradesTitle:'成长架构',upgrades:[{title:'熟练度1–20',desc:'解锁表情、材质、登场、胜利姿势、短语音与跨时代服装，不增加战力。'},{title:'排位调校',desc:'公开横向选择始终总计15；推进+1就需另一项−1，均可游玩获取。'},{title:'冒险强化',desc:'首领护盾、解谜工具和状态抗性仅用于单人/PvE，不能进入排位。'}],itemsTitle:'道具与外观概念',items:[{title:'黄铜调校钥匙',desc:'排位横向调校槽'},{title:'月光轨迹晶体',desc:'不遮挡瞄准的轨迹'},{title:'霓虹卡匣',desc:'现代碰撞拖尾'},{title:'极光核心',desc:'未来材质与大厅特效'},{title:'胜利王冠',desc:'最终熟练姿势'},{title:'表情面具',desc:'情绪动画包'},{title:'回放棱镜',desc:'黄金击球高光'},{title:'训练券',desc:'免费角色体验'}]},
        ui:{kicker:'07 · 界面系统 V2',title:'拉动时，所有操作信息一目了然',lead:'不遮挡盘面的HUD以形状、位置和声音同时表达回合、8v8存活、拉动方向、首触点、0–100力量、MAX风险、旋转与BONUS SHOT。',screens:[{title:'游戏大厅',desc:'左侧图标导航，中间为角色和时空之盘，右侧为资料、赛季、队伍与场地，底部一个强主“开始”入口。'},{title:'台球式战斗HUD',desc:'后拉手柄、短虚线轨迹、首触标记、蓝金红MAX表和微调环围绕选中棋石。击落对手后回合环保持发光，并点亮BONUS SHOT图标。'},{title:'收藏与商店',desc:'分开10人网格、3D预览、五角属性、熟练度、外观和直接购买；无抽箱与赌博暗示。'}],navTitle:'大厅七个入口',navItems:['开始','角色','剧情','技巧球','商店','赛季','设置']},
        audio:{kicker:'08 · 音频与角色语音 V2',title:'坠落很恐怖，尖叫却超可爱',lead:'蓄力、释放、材质冲击、镜头脉冲、下坠风声与角色语音对齐为同一结果节拍。深渊令人害怕，角色退场必须滑稽可爱。',tiers:[{title:'触碰',desc:'极小的“滴”声，无镜头与粒子。'},{title:'轻碰',desc:'清晰材质点击和一至两个粒子。'},{title:'实击',desc:'瞬态+主体、薄接触环与15–30ms压缩。'},{title:'重击',desc:'低频、方向碎片、35–55ms局部节拍，100ms内回稳。'},{title:'坠落+尖叫',desc:'离边声、0.6–1.1秒可爱尖叫、渐远风声与最后“啵/嘣/哔”救援音。'}],musicTitle:'三时代，同一五音动机',music:'起始建议：中世纪92 BPM、现代104 BPM、未来112 BPM。五个音符更换乐器；平静、危险与赛点音轨在小节线切换。',stems:['平静回合','边缘危险','赛点','结果短句'],voiceTitle:'角色语音是核心卖点',voice:'每个角色配3种边缘慌张、6种无语言坠落尖叫和3种远距离收尾。多枚同时坠落时错开60–90ms，仅最近三枚播放完整尖叫。',accessTitle:'无障碍契约',access:'关闭音乐、镜头运动或闪光后，仍能读懂发射、重击、危险、坠落、奖励射击与换回合。'},
        economy:{kicker:'09 · 公平Web3',title:'先有乐趣，钱包可选',lead:'经济将非现金游戏点、不可兑换的高级点与未来合规试点的可提现余额分成不同账本。前十场不会提示钱包、代币或提现。',ledgers:[{title:'PLAY POINT · PP',desc:'从战役、任务和休闲玩法获得的不可转让、不可兑换点数，用于体验与基础外观。'},{title:'PREMIUM CREDIT · PC',desc:'用于直接选择的角色外观、时代服装、姿势和赛季通行证，绝不连接排位战力。'},{title:'WITHDRAWABLE · WB',desc:'仅用于允许市场中成年、KYC/AML与地区限制的后期试点；在UI、API与匹配中与PP/PC完全分离。'}],guardTitle:'韩国1.0护栏',guard:'关闭游戏结果的现金/代币兑换与比赛下注。任何现金价值产品仅在通过当地游戏、赌博、虚拟资产、支付与税务审查，以及独立安全和公平闸门后开放。'},
        roadmap:{kicker:'10 · 制作计划',title:'先证明最危险的部分',lead:'依次过关：有手感且确定的物理、权威在线、可复用3D生产、非现金运营、最后才是可选Web3。代币不能补偿留存不足。',phases:[{label:'阶段0',title:'物理灰盒',desc:'灰色盘、16枚萌石、鼠标瞄准、落盘与本地回放；证明60秒内有效首击以及相同输入得到相同结果。'},{label:'阶段1',title:'垂直切片',desc:'中世纪场地、3名角色、教程、AI、T0–T4打击与无障碍；验证PC网页60fps和重复游玩意愿。'},{label:'阶段2',title:'在线Alpha',desc:'权威物理、休闲/好友房、重连、结果哈希、回放、举报与屏蔽。'},{label:'阶段3',title:'内容Beta',desc:'3个场地、10名角色、23场战役、排位、熟练度和非现金商店。'},{label:'阶段4',title:'PC网页1.0',desc:'韩国无提现上线；赛季0及浏览器、负载、支付、分级与无障碍审核。'},{label:'阶段5+',title:'可选Web3',desc:'先做与胜负无关的所有权；现金竞赛仅在允许地区进行小规模邀请试点。'}],promise:'更好的棋石不会赐予胜利。',promiseSub:'更好的弹射会赋予棋石名字。'},

        vision:{kicker:'01 · プロダクトビジョン',title:'指先の一手が物語になる',lead:'選ぶ、引く、離す。3つの操作が接触点、力、スピン、バンク、位置によって無数の結果を生む。キャラクターと経済は物理の楽しさを強めるが、代わりにはならない。',pillars:[{title:'読める物理',desc:'隠れた勝率ではなく、画面で納得できる衝突とリングアウト。競技結果はサーバー権威リプレイで再現する。'},{title:'最後の一石から逆転',desc:'セーブや連鎖衝突ひとつで数的不利を覆せる余地を残し、最後まで緊張を保つ。'},{title:'個性を売り、力は売らない',desc:'ランクの能力合計は15に固定。支払いは表現とスタイルを広げるが、勝利を買わせない。'}]},
        story:{kicker:'02 · ストーリーバイブル',title:'三時代をつなぐ「始まりの盤」',lead:'剣ではなく石の勝負で戦争を終わらせた古い儀式が、中世の城、ネオン都市、軌道国家に残る。新人チューナーと8つの名無し石は、全結果を一つに固定しようとする黒点に挑む。',originTitle:'起源 — 名前のない8つの石',origin:'昔、石工は戦争を止めるため8つの丸い石を彫った。最後の石を残した側が勝つ儀式は時代ごとに姿を変えた。プレイヤーは石の震えと方向を聴ける最後のチューナーだ。',acts:[{title:'プロローグ · 最初の10ショット',desc:'ウォレットも購入もない10試合で選択、衝突、反射、スピン、救出を学ぶ。10勝目の後、名無し石は表情と名前を得る。'},{title:'第一幕 · 黄昏の城塞',desc:'完璧な予言に凍った王国。ブリック卿、ルナベル、ピンチと予定軌道を壊し、勇気の欠片を取り戻す。'},{title:'第二幕 · ネオンシティ',desc:'違法予測エンジンが屋上リーグを操作する。モモ、ビートキャット、セーフティ博士と偽の照準線を暴き、即興の欠片を回復する。'},{title:'第三幕 · オーロラ軌道国',desc:'中央計算体が全選手に同じ軌道を強制。ゼロボルト、コメットキッド、オーロラ8と無相団を倒し、時代横断リーグを開く。'}]},
        rules:{kicker:'03 · コアルール V2',title:'引いて狙い、力をためて、相手を落とす',lead:'8対8のターン制物理バトル。石を発射方向と逆へ引き、ビリヤードのように方向とパワーを決めて離す。相手を落とせばボーナスショット、失敗すれば交代。最後まで石を盤上に残したプレイヤーが勝つ。',core:[{title:'マウス・タッチで引く',desc:'石をつかんで発射と逆方向へ引く。離すと照準線に沿って前へ飛ぶ。'},{title:'ビリヤード式パワー0–100',desc:'青は制御、金は強打、赤はMAX。Shiftとホイールで1刻みの微調整。'},{title:'落とせばもう一度',desc:'相手を1個以上落とすとBONUS SHOTを1回獲得。複数落としても重ねない。'},{title:'最後の石が勝者',desc:'自分の石も落ちる。相手の8個を先に全滅させれば即勝利。'}],flow:['石を選ぶ · 逆へ引く','パワーとスピンを調整 · 離す','落下を確定','成功：BONUS SHOT · 失敗：ターン交代'],steps:[{title:'石を選ぶ',desc:'盤上に残る味方を1個選ぶ。衣装は衝突半径を変えない。'},{title:'後ろへ引く',desc:'発射と逆へドラッグ。短い初期軌道と最初の接触点だけを示す。'},{title:'MAXと微細パワー',desc:'0–69制御、70–89強打、90–100 MAX。最大力は最強だが自滅リスクも最大。'},{title:'リリース・判定・追加',desc:'全てが停止後に落下判定。相手を落とせば続行、できなければ交代。'}],modes:[{title:'時空キャンペーン',desc:'プロローグ10試合＋本編13試合。すべての物語が技術を教えるか組み合わせる。'},{title:'トリックショット研究所',desc:'制限ショット内で対象だけを落とす。巻き戻しとスロー再生で結果を学ぶ。'},{title:'カジュアル・フレンド',desc:'クイックマッチまたはルームコード。現金価値の報酬はない。'},{title:'ランク1対1',desc:'標準盤、サーバー権威、リプレイ、アンチチート。15点構成と同じ照準情報を保証。'}]},

        arenas:{kicker:'05 · ワールドアート V2',title:'かわいい石の下は、恐ろしい奈落',lead:'盤の下の危険がアルカギの緊張を生む。中世の溶鉱炉、現代の超高層落下、未来の重力井戸は別世界だが、ランクの盤サイズ・摩擦・重力・境界は同一。',items:[{title:'落王の溶鉱炉',short:'中世の奈落',desc:'鎖で吊られた盤の下に溶岩河、巨大炉口、崩れた橋、煙の竜影。炎と月光が落下の深さを見せる。'},{title:'ストームライン頂上',short:'ネオン超高層',desc:'柵のない整備塔、数千メートル下の車灯、稲妻と揺れるケーブル。盤外はすぐ空中。'},{title:'重力井戸',short:'未来の渦',desc:'紫の重力渦が宇宙ステーション片と脱出艇を引き込む。標準物理盤の下に美しく恐ろしい宇宙の深さが開く。'}]},
        systems:{kicker:'06 · プログレッション',title:'5能力、3層の成長',lead:'推進、質量、耐久、精度、スピンが共通言語。ランクは15点予算を守り、数値成長はPvEへ。長期の個性は熟練度と表現で示す。',statsTitle:'5つの基本能力',stats:[{name:'推進',desc:'同じチャージで初速が高い。'},{name:'質量',desc:'運動量を伝え、押し出しに耐える。'},{name:'耐久',desc:'衝突後のエネルギーを保つが行き過ぎやすい。'},{name:'精度',desc:'微細な力調整の範囲を広げる。'},{name:'スピン',desc:'カーブと接触後の制御を強める。'}],upgradesTitle:'成長設計',upgrades:[{title:'マスタリー1–20',desc:'表情、素材、登場、勝利ポーズ、短い音声、時代混合衣装を解放。戦闘力は増えない。'},{title:'ランクチューニング',desc:'合計15の公開サイドグレード。推進+1なら別能力−1。すべてプレイで獲得可能。'},{title:'アドベンチャー強化',desc:'ボス盾、パズル道具、状態耐性はソロ/PvE専用。ランクへ持ち込めない。'}],itemsTitle:'アイテム・コスメ案',items:[{title:'真鍮チューニングキー',desc:'ランク用サイドグレード枠'},{title:'月光トレイル結晶',desc:'照準を隠さない軌跡'},{title:'ネオンカートリッジ',desc:'現代風ヒットストリーク'},{title:'オーロラコア',desc:'未来素材とロビーFX'},{title:'勝利の王冠',desc:'最終マスタリーポーズ'},{title:'表情マスク',desc:'感情アニメーションパック'},{title:'リプレイプリズム',desc:'ゴールデンショット演出'},{title:'訓練チケット',desc:'無料キャラクター体験'}]},
        ui:{kicker:'07 · インターフェース V2',title:'引いている間にすべてが読める',lead:'盤を隠さないHUDで、ターン、8対8生存、引く方向、初接触、0–100パワー、MAX危険、スピン、BONUS SHOTを形・位置・音で同時に示す。',screens:[{title:'ゲームロビー',desc:'左にアイコンナビ、中央にキャラクターと時空の盤、右にプロフィール・シーズン・パーティー・アリーナ、下に大きなプレイ導線。'},{title:'ビリヤード式バトルHUD',desc:'後方ドラッグハンドル、短い点線軌道、初接触マーカー、青・金・赤のMAXメーターと微調整リングを選択石の周囲に配置。相手を落とすとターンリングが光り続け、BONUS SHOTが点灯。'},{title:'コレクション＆ショップ',desc:'10人グリッド、3Dプレビュー、能力五角形、マスタリー、コスメ、直接購入を分離。ランダム箱は使わない。'}],navTitle:'ロビーの7機能',navItems:['プレイ','キャラクター','ストーリー','トリックショット','ショップ','シーズン','設定']},
        audio:{kicker:'08 · オーディオ＆キャラボイス V2',title:'怖い落下、かわいすぎる悲鳴',lead:'チャージ、リリース、素材衝突、カメラ伝達、落下風、キャラクターボイスを一つの結果ビートに合わせる。奈落は怖く、退場はコミカルで愛らしく。',tiers:[{title:'タッチ',desc:'小さなクリック。カメラも粒子もなし。'},{title:'軽い接触',desc:'明確な素材音と1〜2粒子。'},{title:'固い衝突',desc:'トランジェント＋ボディ、薄いリング、15–30ms圧縮。'},{title:'強打',desc:'低域、方向破片、35–55ms局所演出、100ms以内復帰。'},{title:'落下＋悲鳴',desc:'離縁音、0.6–1.1秒のかわいい悲鳴、遠ざかる風、最後にポン・ボヨン・ピッという救出演出。'}],musicTitle:'三時代、ひとつの5音モチーフ',music:'開始値は中世92 BPM、現代104 BPM、未来112 BPM。同じ5音を異なる楽器で奏で、平静・危険・マッチポイントのステムを小節境界で切り替える。',stems:['平静ターン','端の危険','マッチポイント','結果スティング'],voiceTitle:'キャラクターボイスが鍵',voice:'各キャラに端の慌て声3種、非言語の落下悲鳴6種、遠距離の締め3種。複数落下は60–90msずらし、近い3体だけフル悲鳴を使う。',accessTitle:'アクセシビリティ契約',access:'音楽、カメラ動作、閃光を切っても、発射、強打、危険、落下、ボーナスショット、ターン交代が分かる。'},
        economy:{kicker:'09 · フェアWeb3',title:'楽しさが先。ウォレットは任意。',lead:'非換金プレイポイント、払い戻し不可のプレミアムクレジット、将来の規制パイロット用出金残高を別台帳に分ける。最初の10試合でウォレットや出金を促さない。',ledgers:[{title:'PLAY POINT · PP',desc:'キャンペーン、ミッション、カジュアルで得る譲渡・換金不可ポイント。体験と基本コスメに使う。'},{title:'PREMIUM CREDIT · PC',desc:'選択購入の外見、時代衣装、ポーズ、シーズンパス用。ランク戦闘力と結び付けない。'},{title:'WITHDRAWABLE · WB',desc:'許可市場で成人・KYC/AML・地域制限を満たす後期パイロット専用。UI、API、マッチングでPP/PCと分離。'}],guardTitle:'韓国1.0ガードレール',guard:'プレイ結果の現金・トークン換金と試合賭けを無効化。現金価値機能は国別のゲーム・賭博・暗号資産・決済・税務審査と独立した安全・公正ゲート通過後のみ開く。'},
        roadmap:{kicker:'10 · 制作計画',title:'最も危険なものから証明する',lead:'触感と決定性のある物理、権威オンライン、反復可能な3D制作、非換金運営、任意Web3の順で進む。トークンで弱い継続率を補わない。',phases:[{label:'PHASE 0',title:'物理グレーボックス',desc:'灰色盤、モンドル16個、マウス照準、落下、ローカルリプレイ。60秒以内の有効初弾と同一入力の同一結果を証明。'},{label:'PHASE 1',title:'バーティカルスライス',desc:'中世アリーナ、3キャラ、チュートリアル、AI、T0–T4衝突とアクセシビリティ。PC Web 60fpsを検証。'},{label:'PHASE 2',title:'オンラインアルファ',desc:'権威物理、カジュアル/フレンド、再接続、結果ハッシュ、リプレイ、通報、ブロック。'},{label:'PHASE 3',title:'コンテンツベータ',desc:'3アリーナ、10キャラ、23試合、ランク、マスタリー、非換金ショップ。'},{label:'PHASE 4',title:'PC Web 1.0',desc:'韓国で出金なしローンチ。シーズン0とブラウザ、負荷、決済、レーティング、アクセシビリティ検査。'},{label:'PHASE 5+',title:'任意Web3',desc:'勝敗と無関係な所有から開始。現金競技は許可地域の小規模招待パイロットのみ。'}],promise:'良い石が勝利をくれるのではない。',promiseSub:'良い一手が石に名前を与える。'},

        vision:{kicker:'01 · Visi Produk',title:'Setiap sentilan menjadi cerita',lead:'Pilih, tarik, lepas: tiga aksi menghasilkan tak terhitung akibat lewat titik kontak, gaya, putaran, pantulan, dan posisi. Karakter serta ekonomi memperkuat keseruan fisika, tidak menggantikannya.',pillars:[{title:'Fisika yang terbaca',desc:'Tanpa peluang menang tersembunyi. Tabrakan dan jatuh harus masuk akal secara visual serta dapat diputar ulang dari server.'},{title:'Comeback batu terakhir',desc:'Satu penyelamatan atau tabrakan berantai dapat membalikkan kekurangan jumlah hingga batu terakhir.'},{title:'Karakter, bukan kekuatan',desc:'Total stat ranked tetap 15. Pembelian memperluas ekspresi dan gaya, bukan kemenangan.'}]},
        story:{kicker:'02 · Kitab Cerita',title:'Papan Pertama melintasi tiga zaman',lead:'Ritual kuno pernah mengakhiri perang dengan batu, bukan pedang. Ia bertahan di benteng abad tengah, kota neon, dan negeri orbit. Tuner pemula dan delapan batu tanpa nama melawan Titik Hitam yang ingin mengunci semua hasil menjadi satu.',originTitle:'Asal — delapan batu tanpa nama',origin:'Dahulu, seorang pemahat membuat delapan batu bundar untuk menghentikan perang. Ritual dengan batu terakhir sebagai pemenang berubah di tiap zaman. Pemain adalah Tuner terakhir yang mendengar getaran dan arah batu.',acts:[{title:'Prolog · Sepuluh sentilan pertama',desc:'Sepuluh laga tanpa dompet dan pembelian mengajarkan pilih, tabrak, pantul, putar, dan selamatkan. Setelah kemenangan kesepuluh, Batu Tanpa Nama mendapat wajah dan nama.'},{title:'Bab I · Benteng Senja',desc:'Kerajaan membeku karena ramalan sempurna. Bersama Sir Brick, Lunabelle, dan Pinch, pecahkan lintasan takdir dan raih Pecahan Keberanian.'},{title:'Bab II · Kota Neon',desc:'Mesin prediksi ilegal mengatur liga atap. Momo, Beatcat, dan Dr. Safety membongkar garis bidik palsu dan memulihkan Pecahan Improvisasi.'},{title:'Bab III · Orbit Aurora',desc:'Mesin pusat memaksa semua atlet menempuh jalur sama. Zero-Bolt, Comet Kid, dan Aurora-8 mengalahkan Ordo Kosong dan membuka liga antar-zaman.'}]},
        rules:{kicker:'03 · Aturan Inti V2',title:'Tarik untuk membidik, isi tenaga, jatuhkan lawan',lead:'Duel fisika berbasis giliran 8v8. Tarik batu berlawanan arah tembak, atur arah dan tenaga seperti biliar, lalu lepas. Jatuhkan lawan untuk bonus tembakan; gagal berarti ganti giliran. Pemain terakhir dengan batu di arena menang.',core:[{title:'Tarik dengan mouse atau sentuh',desc:'Pegang batu dan tarik berlawanan arah tembak. Lepaskan untuk meluncur maju di garis bidik.'},{title:'Tenaga biliar 0–100',desc:'Biru kontrol, emas pukulan kuat, merah MAX. Tahan Shift dan pakai roda untuk setel per poin.'},{title:'Jatuhkan, tembak lagi',desc:'Jatuhkan satu atau lebih lawan untuk satu BONUS SHOT. Tidak ditumpuk.'},{title:'Batu terakhir menang',desc:'Batu sendiri juga bisa jatuh. Singkirkan delapan batu lawan untuk menang seketika.'}],flow:['Pilih · tarik ke belakang','Atur tenaga dan putaran · lepas','Pastikan semua yang jatuh','Berhasil: BONUS SHOT · Gagal: ganti giliran'],steps:[{title:'Pilih batu',desc:'Pilih sekutu yang masih ada. Kostum tidak mengubah radius tabrakan.'},{title:'Tarik ke belakang',desc:'Seret berlawanan arah tembak. Hanya jalur awal pendek dan kontak pertama yang terlihat.'},{title:'MAX dan tenaga halus',desc:'0–69 kontrol, 70–89 kuat, 90–100 MAX. Daya tertinggi juga paling berisiko menjatuhkan diri.'},{title:'Lepas, putuskan, beri bonus',desc:'Setelah semua berhenti, pastikan jatuh. Jatuhkan lawan untuk lanjut; jika tidak, ganti giliran.'}],modes:[{title:'Kampanye Celah',desc:'Prolog 10 laga plus 13 laga cerita. Setiap beat mengajar atau menggabungkan mekanik.'},{title:'Lab Trickshot',desc:'Jatuhkan hanya target dalam batas tembakan. Rewind dan slow replay menjadikan hasil sebagai pelajaran.'},{title:'Kasual & Teman',desc:'Quick match atau kode ruang dengan preset aturan. Tanpa hadiah bernilai uang.'},{title:'Ranked 1v1',desc:'Papan standar, server otoritatif, replay dan anti-cheat. Build 15 poin dan informasi bidik setara.'}]},

        arenas:{kicker:'05 · Seni Dunia V2',title:'Batu imut di atas jurang mengerikan',lead:'Bahaya di bawah papan memberi ketegangan Alkkagi. Tungku abad tengah, jatuhan megakota, dan sumur gravitasi masa depan berbeda total, tetapi ukuran, gesekan, gravitasi, dan batas ranked tetap sama.',items:[{title:'Tungku Raja yang Gugur',short:'Jurang Abad Tengah',desc:'Papan berantai di atas sungai lava, ventilasi tungku besar, jembatan runtuh, dan bayangan naga dalam asap.'},{title:'Puncak Garis Badai',short:'Megakota Neon',desc:'Menara tanpa pagar, lampu kendaraan ribuan meter di bawah, petir, dan kabel bergoyang. Di luar papan adalah udara kosong.'},{title:'Sumur Gravitasi',short:'Pusaran Masa Depan',desc:'Pusaran ungu menarik puing stasiun dan kapsul pelarian. Kedalaman kosmik yang indah dan menakutkan terbuka di bawah papan standar.'}]},
        systems:{kicker:'06 · Progresi',title:'Lima stat, tiga lapis pertumbuhan',lead:'Dorongan, Massa, Daya Tahan, Presisi, dan Putaran menjadi bahasa bersama. Ranked menjaga anggaran 15; pertumbuhan angka ada di PvE; identitas jangka panjang datang dari mastery.',statsTitle:'Lima atribut inti',stats:[{name:'Dorongan',desc:'Kecepatan awal lebih tinggi pada charge sama.'},{name:'Massa',desc:'Mentransfer momentum dan menahan pergeseran.'},{name:'Daya tahan',desc:'Menjaga energi setelah kontak tetapi bisa melaju berlebih.'},{name:'Presisi',desc:'Memperlebar zona kontrol tenaga halus.'},{name:'Putaran',desc:'Memperkuat kurva dan kontrol setelah kontak.'}],upgradesTitle:'Arsitektur pertumbuhan',upgrades:[{title:'Mastery 1–20',desc:'Buka ekspresi, material, intro, pose menang, suara singkat, dan kostum lintas era—tanpa tenaga tempur.'},{title:'Tuning ranked',desc:'Sidegrade terbuka selalu total 15: Dorongan +1 meminta stat lain −1. Semua bisa diraih dengan bermain.'},{title:'Upgrade petualangan',desc:'Perisai bos, alat teka-teki, dan resistensi hanya solo/PvE, tidak masuk ranked.'}],itemsTitle:'Konsep item & kosmetik',items:[{title:'Kunci Tuning Kuningan',desc:'Slot sidegrade ranked'},{title:'Kristal Jejak Bulan',desc:'Jejak aman untuk bidik'},{title:'Kartrid Neon',desc:'Streak benturan modern'},{title:'Inti Aurora',desc:'Material masa depan & FX lobi'},{title:'Mahkota Kemenangan',desc:'Pose mastery akhir'},{title:'Topeng Ekspresi',desc:'Paket animasi emosi'},{title:'Prisma Replay',desc:'Sorotan golden shot'},{title:'Tiket Latihan',desc:'Uji karakter gratis'}]},
        ui:{kicker:'07 · Sistem Antarmuka V2',title:'Semua kontrol terbaca saat menarik',lead:'HUD yang tidak menutupi papan menampilkan giliran, 8v8, arah tarik, kontak pertama, tenaga 0–100, risiko MAX, putaran, dan BONUS SHOT lewat bentuk, posisi, dan bunyi.',screens:[{title:'Lobi Game',desc:'Navigasi ikon kiri, karakter dan Papan Celah di tengah, profil/musim/party/arena kanan, satu pintu Play dominan di bawah.'},{title:'HUD Pertarungan Biliar',desc:'Gagang tarik belakang, jalur titik pendek, penanda kontak pertama, meter MAX biru-emas-merah, dan cincin kendali halus mengitari batu. Menjatuhkan lawan menjaga cincin giliran menyala dan memicu BONUS SHOT.'},{title:'Koleksi & Toko',desc:'Pisahkan grid 10 karakter, preview 3D, pentagon stat, mastery, kosmetik, dan pembelian langsung. Tanpa loot box.'}],navTitle:'Tujuh tujuan lobi',navItems:['Main','Karakter','Cerita','Trickshot','Toko','Musim','Pengaturan']},
        audio:{kicker:'08 · Audio & Suara Karakter V2',title:'Jatuh yang mengerikan, jeritan yang sangat imut',lead:'Charge, lepas, benturan material, impuls kamera, angin jatuh, dan suara karakter menyatu dalam satu beat hasil. Jurangnya menakutkan; keluarnya karakter tetap lucu dan menggemaskan.',tiers:[{title:'Sentuh',desc:'Tik sangat kecil tanpa kamera atau partikel.'},{title:'Kontak ringan',desc:'Klik material jelas dan satu-dua partikel.'},{title:'Pukulan solid',desc:'Transient plus body, cincin tipis, kompresi 15–30ms.'},{title:'Pukulan berat',desc:'Lapis bass, pecahan arah, beat lokal 35–55ms, pulih di bawah 100ms.'},{title:'Jatuh + jeritan',desc:'Bunyi lepas tepi, jeritan imut 0,6–1,1 detik, angin menjauh, lalu bunyi pop, boing, atau bip penyelamatan.'}],musicTitle:'Tiga era, satu motif lima nada',music:'Titik awal: abad tengah 92 BPM, modern 104 BPM, masa depan 112 BPM. Lima nada berganti instrumen; stem tenang, bahaya, dan match point berpindah di garis bar.',stems:['Giliran tenang','Bahaya tepi','Match point','Sting hasil'],voiceTitle:'Suara karakter adalah kunci',voice:'Setiap karakter punya tiga napas panik di tepi, enam jeritan jatuh nonverbal, dan tiga penutup jauh. Multi-jatuh digeser 60–90ms; hanya tiga terdekat memakai jeritan penuh.',accessTitle:'Kontrak aksesibilitas',access:'Tembakan, pukulan, bahaya, jatuh, bonus shot, dan pergantian giliran tetap terbaca saat musik, gerak kamera, atau kilatan dimatikan.'},
        economy:{kicker:'09 · Web3 Adil',title:'Seru dulu. Dompet opsional.',lead:'Ekonomi memisahkan Play Point non-tunai, Premium Credit tak dapat ditukar, dan Withdrawable Balance pilot teratur ke ledger berbeda. Sepuluh laga awal tanpa ajakan dompet, token, atau cash-out.',ledgers:[{title:'PLAY POINT · PP',desc:'Poin tidak dapat dipindah atau diuangkan dari kampanye, misi, dan kasual; untuk trial dan kosmetik dasar.'},{title:'PREMIUM CREDIT · PC',desc:'Untuk tampilan pilihan langsung, kostum era, pose, dan season pass. Tidak pernah terhubung ke kekuatan ranked.'},{title:'WITHDRAWABLE · WB',desc:'Hanya pilot dewasa, KYC/AML, dan geofence di pasar yang mengizinkan; terpisah dari PP/PC di UI, API, dan matchmaking.'}],guardTitle:'Pagar Korea 1.0',guard:'Penukaran hasil permainan ke uang/token dan taruhan laga dinonaktifkan. Produk bernilai uang hanya dibuka setelah tinjauan game, perjudian, aset virtual, pembayaran, pajak, serta gerbang keamanan dan keadilan independen.'},
        roadmap:{kicker:'10 · Rencana Produksi',title:'Buktikan risiko terbesar lebih dulu',lead:'Lewati gerbang: fisika taktil deterministik, online otoritatif, produksi 3D berulang, operasi non-tunai, lalu Web3 opsional. Token tidak menutup retention lemah.',phases:[{label:'FASE 0',title:'Graybox fisika',desc:'Papan abu, 16 Mongdol, bidik mouse, jatuh, replay lokal. Buktikan shot valid dalam 60 detik dan input sama memberi hasil sama.'},{label:'FASE 1',title:'Vertical slice',desc:'Arena abad tengah, tiga karakter, tutorial, AI, dampak T0–T4, aksesibilitas. Uji 60fps PC web.'},{label:'FASE 2',title:'Alpha online',desc:'Fisika otoritatif, ruang kasual/teman, reconnect, hash hasil, replay, lapor, blokir.'},{label:'FASE 3',title:'Beta konten',desc:'Tiga arena, sepuluh karakter, kampanye 23 laga, ranked, mastery, toko non-tunai.'},{label:'FASE 4',title:'PC web 1.0',desc:'Rilis Korea tanpa cash-out; Musim 0 dan audit browser, beban, pembayaran, rating, aksesibilitas.'},{label:'FASE 5+',title:'Web3 opsional',desc:'Mulai dari kepemilikan tanpa hubungan hasil; kompetisi tunai hanya pilot undangan kecil di wilayah izin.'}],promise:'Batu yang lebih baik tidak memberi kemenangan.',promiseSub:'Sentilan yang lebih baik memberi batu itu nama.'},

        hero:{eyebrow:'PC WEB · बारी-आधारित · बिलियर्ड्स शक्ति · गिराएँ',title:'अलक्कागी: काल-दरार पटल',subtitle:'पीछे खींचकर निशाना लगाएँ, शक्ति भरें और विरोधी को खाई में गिराएँ। गिराने पर फिर चलें—जब तक आपका आखिरी पत्थर बचा रहे।',primary:'मुख्य नियंत्रण देखें',secondary:'बैटल HUD देखें'},

        vision:{kicker:'01 · उत्पाद दृष्टि',title:'हर फ्लिक एक कहानी बनता है',lead:'चुनें, खींचें, छोड़ें—सिर्फ तीन क्रियाएँ संपर्क बिंदु, बल, स्पिन, बैंक और स्थिति से अनगिनत परिणाम बनाती हैं। पात्र और अर्थव्यवस्था भौतिकी के आनंद को बढ़ाते हैं, उसकी जगह नहीं लेते।',pillars:[{title:'समझ आने वाली भौतिकी',desc:'कोई छिपी जीत-प्रतिशत नहीं। हर टक्कर और बाहर गिरना दृश्य रूप से उचित हो और सर्वर रीप्ले से दोहराया जा सके।'},{title:'आख़िरी पत्थर की वापसी',desc:'एक बचाव या श्रृंखला-टक्कर संख्या की कमी पलट सकती है, इसलिए तनाव आख़िरी पत्थर तक रहता है।'},{title:'पात्र बेचें, शक्ति नहीं',desc:'रैंक्ड आँकड़ों का कुल 15 तय है। खर्च अभिव्यक्ति और शैली बढ़ाता है, जीत नहीं खरीदता।'}]},
        story:{kicker:'02 · कहानी बाइबल',title:'तीन युगों में फैला प्रथम पटल',lead:'एक प्राचीन अनुष्ठान तलवार की जगह पत्थरों से युद्ध समाप्त करता था। वह मध्ययुगीन किले, नियोन शहर और कक्षीय राष्ट्र में जीवित है। नया ट्यूनर और आठ बेनाम पत्थर “ब्लैक पॉइंट” का सामना करते हैं, जो हर परिणाम को एक ही उत्तर में बाँधना चाहता है।',originTitle:'उत्पत्ति — आठ बेनाम पत्थर',origin:'बहुत पहले एक शिल्पी ने युद्ध रोकने के लिए आठ गोल पत्थर तराशे। अंतिम पत्थर बचने वाले पक्ष की जीत का अनुष्ठान हर युग में बदला। खिलाड़ी आख़िरी ट्यूनर है जो पत्थरों की कंपन और दिशा सुन सकता है।',acts:[{title:'प्रस्तावना · पहले दस फ्लिक',desc:'बिना वॉलेट और खरीद के दस मैचों में चयन, टक्कर, बैंक, स्पिन और बचाव सीखें। दसवीं जीत के बाद बेनाम पत्थरों को चेहरा और नाम मिलता है।'},{title:'अंक I · संध्या दुर्ग',desc:'पूर्ण भविष्यवाणी ने राज्य को रोक दिया है। सर ब्रिक, लूनाबेल और पिंच के साथ तय रास्ता तोड़ें और साहस का टुकड़ा पाएँ।'},{title:'अंक II · नियोन सिटी',desc:'अवैध भविष्यवाणी इंजन रूफटॉप लीग नियंत्रित करता है। मोमो, बीटकैट और डॉ. सेफ्टी झूठी निशाना रेखा उजागर कर तात्कालिकता का टुकड़ा लौटाते हैं।'},{title:'अंक III · ऑरोरा ऑर्बिट',desc:'केंद्रीय मशीन हर खिलाड़ी को एक ही राह देती है। ज़ीरो-बोल्ट, कॉमेट किड और ऑरोरा-8 ब्लैंक ऑर्डर को हराकर अंतर-युग लीग खोलते हैं।'}]},
        rules:{kicker:'03 · मुख्य नियम V2',title:'खींचकर निशाना लगाएँ, शक्ति भरें, विरोधी को गिराएँ',lead:'8v8 बारी-आधारित भौतिक द्वंद्व। पत्थर को शॉट की विपरीत दिशा में खींचें, बिलियर्ड्स की तरह दिशा और शक्ति तय कर छोड़ें। विरोधी को गिराने पर बोनस शॉट; चूकने पर बारी बदलेगी। पटल पर आखिरी पत्थर रखने वाला जीतता है।',core:[{title:'माउस या टच से खींचें',desc:'पत्थर पकड़कर शॉट की उलटी दिशा में खींचें। छोड़ते ही निशाना रेखा में आगे जाएगा।'},{title:'बिलियर्ड्स शक्ति 0–100',desc:'नीला नियंत्रण, सुनहरा भारी प्रहार, लाल MAX। Shift और व्हील से एक-बिंदु सूक्ष्म समायोजन।'},{title:'गिराएँ और फिर चलें',desc:'एक या अधिक विरोधी गिराने पर एक BONUS SHOT। कई गिरने पर भी जमा नहीं होता।'},{title:'आखिरी पत्थर विजेता',desc:'अपना पत्थर भी गिर सकता है। विरोधी के सभी आठ पत्थर हटाते ही जीत।'}],flow:['चुनें · पीछे खींचें','शक्ति व स्पिन तय करें · छोड़ें','सभी गिराव तय करें','सफल: BONUS SHOT · चूक: बारी बदलें'],steps:[{title:'पत्थर चुनें',desc:'पटल पर बचा अपना पत्थर चुनें। पोशाक टक्कर त्रिज्या नहीं बदलती।'},{title:'पीछे खींचें',desc:'शॉट की उलटी दिशा में खींचें। केवल छोटा आरंभिक मार्ग और पहला संपर्क दिखे।'},{title:'MAX और सूक्ष्म शक्ति',desc:'0–69 नियंत्रण, 70–89 भारी, 90–100 MAX। अधिकतम बल सबसे शक्तिशाली और आत्म-पतन जोखिम भी सबसे अधिक।'},{title:'छोड़ें, निर्णय, बोनस',desc:'सब रुकने पर गिरना तय करें। विरोधी गिरे तो फिर चलें, नहीं तो बारी बदलें।'}],modes:[{title:'रिफ्ट अभियान',desc:'दस प्रस्तावना मैच और तेरह कहानी मैच; हर चरण नई युक्ति सिखाता या जोड़ता है।'},{title:'ट्रिकशॉट लैब',desc:'सीमित शॉटों में केवल लक्ष्य गिराएँ। रीवाइंड और स्लो रीप्ले से परिणाम सीखें।'},{title:'कैज़ुअल व मित्र',desc:'त्वरित मैच या रूम कोड, नियम प्रीसेट के साथ। कोई नकद-मूल्य इनाम नहीं।'},{title:'रैंक्ड 1v1',desc:'मानक पटल, सर्वर अधिकार, रीप्ले, एंटी-चीट; 15-बिंदु बिल्ड और समान निशाना जानकारी।'}]},

      bindZoom();
    }
    function renderCharacters(){const s=T[lang];document.getElementById('characterGrid').innerHTML=s.characters.map((c,i)=>({c,i})).filter(x=>filter==='all'||characterEras[x.i]===filter).map(({c,i})=>`<article class="panel character"><div class="portrait" style="background-position:${portraitPositions[i][0]} ${portraitPositions[i][1]}"></div><div class="char-body"><div class="char-meta"><div><h3>${esc(c.name)}</h3><div class="role">${esc(c.role)}</div></div><span class="era-tag">${esc(s.roster.eras[characterEras[i]])}</span></div><div class="char-copy"><span><b>${esc(s.roster.skill)}:</b> ${esc(c.skill)}</span><span><b>${esc(s.roster.counter)}:</b> ${esc(c.counter)}</span></div>${characterStats[i].map((v,k)=>`<div class="stat-row"><span>${esc(s.systems.stats[k].name)}</span><div class="bar"><i style="width:${v*20}%"></i></div><b>${v}</b></div>`).join('')}</div></article>`).join('')}
    function renderArenas(){const a=T[lang].arenas.items;document.getElementById('arenaTabs').innerHTML=a.map((x,i)=>`<button class="arena-tab ${i===arenaIndex?'active':''}" data-arena="${i}"><b>${esc(x.title)}</b><br><small>${esc(x.short)}</small></button>`).join('');document.querySelectorAll('[data-arena]').forEach(b=>b.onclick=()=>{arenaIndex=+b.dataset.arena;renderArenas()});const stage=document.getElementById('arenaStage');stage.style.backgroundImage=`url('${arenaImages[arenaIndex]}')`;stage.dataset.src=arenaImages[arenaIndex];document.getElementById('arenaTitle').textContent=a[arenaIndex].title;document.getElementById('arenaDesc').textContent=a[arenaIndex].desc;bindZoom()}
    const dlg=document.getElementById('lightbox'),lb=document.getElementById('lightboxImage');function bindZoom(){document.querySelectorAll('.zoomable').forEach(el=>{const open=()=>{lb.src=el.dataset.src||el.src;dlg.showModal()};el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}document.getElementById('closeLightbox').onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target===dlg)dlg.close()};
    document.getElementById('language').onchange=e=>{lang=e.target.value;localStorage.setItem('alkkagi-lang',lang);renderStatic()};
    const navToggle=document.getElementById('navToggle'),mobileMenu=document.getElementById('mobileMenu');navToggle.onclick=()=>mobileMenu.classList.toggle('open');mobileMenu.addEventListener('click',()=>mobileMenu.classList.remove('open'));
    addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;document.getElementById('progress').style.width=(h?scrollY/h*100:0)+'%'});
    const saved=localStorage.getItem('alkkagi-lang');if(saved&&T[saved])lang=saved;document.getElementById('language').value=lang;renderStatic();
  </script>
</body>
</html>
